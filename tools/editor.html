<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>post editor · sw1tchc4se</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FCF3F6; --surface: #fffdfe; --surface-2: #fbeef3;
      --primary: #84C57C; --accent: #DB5E8E; --text: #3A2E2A;
      --muted: #8a7a74; --border: #f3dde5; --on-primary: #1f3d1b;
      --font-body: "Nunito", system-ui, sans-serif; --font-head: "Fraunces", Georgia, serif;
      --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
    }
    [data-theme="dark"] {
      --bg: #241D29; --surface: #2E2536; --surface-2: #38303f;
      --primary: #A6D89E; --accent: #F4A6C4; --text: #F1E7EC;
      --muted: #c3aebb; --border: #463950; --on-primary: #18241b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 14px; padding: 12px 18px;
      border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    }
    header h1 { font-family: var(--font-head); font-size: 1.15rem; margin: 0; font-weight: 600; }
    header .spacer { margin-left: auto; }
    .btn {
      font-family: inherit; font-weight: 800; font-size: 0.88rem; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      padding: 8px 14px; border-radius: 999px; transition: filter .15s, transform .15s;
    }
    .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
    select, input, textarea {
      font-family: inherit; font-size: 0.92rem; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--primary); }
    main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
    .pane { min-height: 0; display: flex; flex-direction: column; }
    .pane.edit { border-right: 1px solid var(--border); }
    .meta { padding: 14px 18px; display: grid; gap: 10px; border-bottom: 1px solid var(--border); overflow-y: auto; max-height: 46%; }
    .row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 10px; }
    .row label { font-weight: 800; font-size: 0.82rem; color: var(--muted); }
    .row .inline { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .row .inline label { display: inline-flex; gap: 6px; align-items: center; color: var(--text); font-weight: 700; }
    .hint { font-size: 0.78rem; color: var(--muted); }
    .toolbar { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 18px; border-bottom: 1px solid var(--border); }
    .toolbar button {
      font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer; color: var(--text);
      border: 1px solid var(--border); background: var(--surface); padding: 4px 9px; border-radius: 6px;
    }
    .toolbar button:hover { background: var(--surface-2); }
    #body {
      flex: 1; resize: none; border: none; border-radius: 0; padding: 16px 18px;
      font-family: var(--font-mono); font-size: 0.9rem; line-height: 1.6; background: var(--bg);
    }
    .pane.preview { background: var(--bg); }
    .preview-head { padding: 8px 18px; font-size: 0.78rem; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; gap: 14px; }
    iframe { flex: 1; width: 100%; border: none; background: var(--bg); }
    #status { font-size: 0.82rem; color: var(--muted); }
    #status.ok { color: var(--primary); }
    #status.err { color: var(--accent); }
    a { color: var(--accent); font-weight: 700; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } .pane.preview { display: none; } }
  </style>
</head>
<body>
  <header>
    <h1>✿ post editor</h1>
    <select id="load" title="load an existing post"><option value="">— new post —</option></select>
    <div class="spacer"></div>
    <span id="status"></span>
    <button class="btn" id="theme">◐ theme</button>
    <button class="btn" id="download">⬇ .md</button>
    <button class="btn" id="copy">⧉ copy</button>
    <button class="btn primary" id="save">save &amp; build</button>
  </header>

  <main>
    <section class="pane edit">
      <div class="meta">
        <div class="row"><label for="title">title</label><input id="title" placeholder="HTB: Cicada" /></div>
        <div class="row"><label for="slug">slug</label><input id="slug" placeholder="htb-cicada" /></div>
        <div class="row"><label for="date">date</label><input id="date" type="date" /></div>
        <div class="row"><label for="tags">tags</label><input id="tags" placeholder="writeup, htb, active-directory" /></div>
        <div class="row">
          <label for="excerpt">excerpt</label>
          <div>
            <textarea id="excerpt" rows="2" style="width:100%" placeholder="One or two sentences for the card + SEO."></textarea>
            <span class="hint"><a href="#" id="autoExcerpt">auto-fill from first paragraph</a></span>
          </div>
        </div>
        <div class="row">
          <label>flags</label>
          <div class="inline">
            <label><input type="checkbox" id="pinned" /> pinned</label>
            <label><input type="checkbox" id="draft" /> draft (hidden)</label>
            <span class="hint" id="readtime"></span>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <button data-wrap="**">B</button>
        <button data-wrap="*">i</button>
        <button data-wrap="`">code</button>
        <button data-prefix="## ">H2</button>
        <button data-prefix="### ">H3</button>
        <button data-prefix="> ">quote</button>
        <button data-prefix="- ">list</button>
        <button data-tmpl="link">link</button>
        <button data-tmpl="image">image</button>
        <button data-tmpl="codeblock">```code```</button>
        <button data-tmpl="table">table</button>
      </div>

      <textarea id="body" spellcheck="true" placeholder="Write your writeup in Markdown…"></textarea>
    </section>

    <section class="pane preview">
      <div class="preview-head"><span>live preview — rendered by the real site</span></div>
      <iframe id="preview" title="preview"></iframe>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const fields = ["title", "slug", "date", "tags", "excerpt", "pinned", "draft", "body"];
    let slugTouched = false;

    function slugify(t) {
      return t.toLowerCase().replace(/[^\w\s-]/g, "").replace(/[\s_]+/g, "-").replace(/-{2,}/g, "-").replace(/^-|-$/g, "");
    }
    function todayISO() { return new Date().toISOString().slice(0, 10); }

    $("date").value = todayISO();
    $("title").addEventListener("input", () => { if (!slugTouched) $("slug").value = slugify($("title").value); });
    $("slug").addEventListener("input", () => { slugTouched = true; });

    // ---- markdown toolbar ----
    function wrapSelection(before, after = before) {
      const ta = $("body"), s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
      ta.value = v.slice(0, s) + before + v.slice(s, e) + after + v.slice(e);
      ta.focus(); ta.selectionStart = s + before.length; ta.selectionEnd = e + before.length;
      schedule();
    }
    function prefixLines(prefix) {
      const ta = $("body"), s = ta.selectionStart, v = ta.value;
      const lineStart = v.lastIndexOf("\n", s - 1) + 1;
      ta.value = v.slice(0, lineStart) + prefix + v.slice(lineStart);
      ta.focus(); ta.selectionStart = ta.selectionEnd = s + prefix.length;
      schedule();
    }
    function insert(text, caretBack = 0) {
      const ta = $("body"), s = ta.selectionStart, v = ta.value;
      ta.value = v.slice(0, s) + text + v.slice(ta.selectionEnd);
      ta.focus(); ta.selectionStart = ta.selectionEnd = s + text.length - caretBack;
      schedule();
    }
    const TEMPLATES = {
      link: () => insert("[text](https://)", 1),
      image: () => insert("![alt](../assets/image.png)", 0),
      codeblock: () => insert("```bash\n\n```\n", 5),
      table: () => insert("| col | col |\n| --- | --- |\n| a | b |\n", 0),
    };
    document.querySelectorAll(".toolbar button").forEach((b) => {
      b.addEventListener("click", () => {
        if (b.dataset.wrap) wrapSelection(b.dataset.wrap);
        else if (b.dataset.prefix) prefixLines(b.dataset.prefix);
        else if (b.dataset.tmpl) TEMPLATES[b.dataset.tmpl]();
      });
    });

    // ---- excerpt + reading time ----
    function firstParagraph() {
      for (const block of $("body").value.split(/\n\s*\n/)) {
        const t = block.trim();
        if (t && !/^(#|>|-|\*|\||!|`|\d+\.)/.test(t))
          return t.replace(/!\[[^\]]*\]\([^)]*\)/g, "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
                  .replace(/[*_`~]/g, "").replace(/\s+/g, " ").trim();
      }
      return "";
    }
    $("autoExcerpt").addEventListener("click", (e) => {
      e.preventDefault();
      const p = firstParagraph();
      $("excerpt").value = p.length > 180 ? p.slice(0, 180).replace(/\s+\S*$/, "") + "…" : p;
    });
    function updateReadtime() {
      const words = $("body").value.trim().split(/\s+/).filter(Boolean).length;
      $("readtime").textContent = words ? `${words} words · ~${Math.max(1, Math.round(words / 200))} min` : "";
    }

    // ---- live preview via the real renderer ----
    let timer;
    function schedule() { clearTimeout(timer); timer = setTimeout(render, 250); updateReadtime(); }
    async function render() {
      let html = "";
      try {
        const r = await fetch("/api/preview", { method: "POST", body: JSON.stringify({ markdown: $("body").value }) });
        html = (await r.json()).html || "";
      } catch (e) { html = "<p>preview unavailable</p>"; }
      const theme = document.documentElement.getAttribute("data-theme");
      $("preview").srcdoc = `<!doctype html><html data-theme="${theme}"><head>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
        <style>body{min-height:0!important;padding:8px 6px}</style></head>
        <body class="post-page"><main class="container"><h1 style="font-family:var(--font-head)">${escapeHtml($("title").value || "Untitled")}</h1>
        <article class="prose">${html}</article></main>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>
        <script>document.querySelectorAll("pre code").forEach(b=>hljs.highlightElement(b));<\/script></body></html>`;
    }
    function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

    $("body").addEventListener("input", schedule);
    $("title").addEventListener("input", schedule);

    // ---- gather / front-matter ----
    function gather() {
      return {
        title: $("title").value.trim(),
        slug: $("slug").value.trim() || slugify($("title").value),
        date: $("date").value || todayISO(),
        tags: $("tags").value.split(",").map((t) => t.trim().replace(/^#/, "")).filter(Boolean),
        pinned: $("pinned").checked,
        draft: $("draft").checked,
        excerpt: $("excerpt").value.trim(),
        body: $("body").value,
      };
    }
    function frontmatter(p) {
      const q = (s) => '"' + String(s).replace(/\s+/g, " ").trim().replace(/"/g, "'") + '"';
      return `---\ntitle: ${q(p.title)}\ndate: ${q(p.date)}\ntags: [${p.tags.map(q).join(", ")}]\n`
        + `pinned: ${p.pinned}\ndraft: ${p.draft}\nexcerpt: ${q(p.excerpt)}\n---\n\n`;
    }
    function status(msg, kind = "") { const s = $("status"); s.textContent = msg; s.className = kind; }

    // ---- download / copy / save ----
    $("download").addEventListener("click", () => {
      const p = gather();
      if (!p.slug) return status("need a title or slug", "err");
      const blob = new Blob([frontmatter(p) + p.body.trim() + "\n"], { type: "text/markdown" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `${p.slug}.md`; a.click();
      status(`downloaded ${p.slug}.md`, "ok");
    });
    $("copy").addEventListener("click", async () => {
      const p = gather();
      await navigator.clipboard.writeText(frontmatter(p) + p.body.trim() + "\n");
      status("copied markdown to clipboard", "ok");
    });
    $("save").addEventListener("click", async () => {
      const p = gather();
      if (!p.title) return status("title is required", "err");
      if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(p.slug)) return status("slug must be lowercase-with-hyphens", "err");
      status("saving + building…");
      try {
        const r = await fetch("/api/save", { method: "POST", body: JSON.stringify(p) });
        const d = await r.json();
        if (!r.ok || d.error) return status(d.error || "save failed", "err");
        $("status").innerHTML = `${d.updated ? "updated" : "saved"} ${d.file} — `
          + `<a href="${d.url}" target="_blank">view post ↗</a> · now commit &amp; push`;
        $("status").className = "ok";
        loadList();
      } catch (e) { status("save failed: " + e.message, "err"); }
    });

    // ---- load existing ----
    async function loadList() {
      const posts = await (await fetch("/api/posts")).json();
      const sel = $("load");
      sel.innerHTML = `<option value="">— new post —</option>` +
        posts.map((p) => `<option value="${p.slug}">${p.draft ? "◌ " : ""}${p.title}</option>`).join("");
    }
    $("load").addEventListener("change", async (e) => {
      const slug = e.target.value;
      if (!slug) { document.querySelector("form")?.reset?.(); return; }
      const d = await (await fetch("/api/post/" + slug)).json();
      $("title").value = d.data.title || ""; $("slug").value = d.slug; slugTouched = true;
      $("date").value = (d.data.date || todayISO()).slice(0, 10);
      $("tags").value = (d.data.tags || []).join(", ");
      $("excerpt").value = d.data.excerpt || "";
      $("pinned").checked = !!d.data.pinned; $("draft").checked = !!d.data.draft;
      $("body").value = d.content.trim(); schedule();
      status(`loaded ${slug}`, "ok");
    });

    // ---- theme ----
    $("theme").addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next); render();
    });

    loadList(); render(); updateReadtime();
  </script>
</body>
</html>
